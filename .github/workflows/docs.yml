name: Docs

# Latest docs (GitHub Pages) redeploy independently of core npm releases.
# - release published → snapshot after a core release (same as before)
# - push to main under docs/** → extension / guide updates without a version bump
# - workflow_dispatch → manual redeploy
# - repository_dispatch (docs-redeploy) → Stambha-plugins CI after a plugin release
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "pnpm-lock.yaml"
      - "package.json"
  repository_dispatch:
    types: [docs-redeploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release → tag; repository_dispatch → main tip; push / workflow_dispatch → triggering ref.
          ref: ${{ github.event_name == 'repository_dispatch' && 'refs/heads/main' || github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build VitePress site
        run: pnpm --filter @stambha/docs build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
